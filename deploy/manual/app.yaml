# ── MANUAL (NO-DAB) DEPLOY — LOCAL DATABASE MODE ────────────────────────────────────────────────────
# Copy this file to `app/app.yaml` before you upload the `app/` folder to your workspace:
#
#     cp deploy/manual/app.yaml app/app.yaml
#
# WHY IT IS NOT ALREADY THERE: `app/app.yaml` is in .gitignore, because the DAB path GENERATES it per
# target and a committed copy is a stale copy waiting to be deployed to the wrong target. So a fresh
# clone has no app.yaml at all, and an app pointed at a source folder with no app.yaml starts with no
# command and no environment — it fails in a way that looks like the code is broken. This file exists so
# the manual path has one to copy.
#
# NOTHING HAS TO BE EDITED BEFORE YOU DEPLOY — it works as shipped, with the built-in operator password
# (see app/lib/config.py). Set OPERATOR_PASSWORD below if you want your own.
command: ["python", "app.py"]
env:
  # ── local database mode: no catalog, no table, no grant, no warehouse needed for logging ──────────
  - name: STORAGE_MODE
    value: "local"
  # /tmp is the one path writable in every Apps container. ⚠️ EPHEMERAL: a restart or redeploy loses
  # it. Export from the Operator page to keep a copy; import it back to restore. See README.
  - name: LOCAL_DB_PATH
    value: "/tmp/night_desk/night_desk.db"

  # ── who may open the Operator page, see the logs, release weeks and RESET the game ───────────────
  # Anyone with the password — there is no address allowlist. `none` below means
  # "use the built-in default password" rather than "closed" — so this file works unedited.
  # ⛔ CHANGE THIS IF THE OPERATOR PAGE MATTERS. `none` does NOT mean closed: it falls back to the
  #    built-in default password in `app/lib/config.py`, which is PUBLIC because it is in this repo.
  #    Anyone who can read this file or the repo can read it, so it gates PLAYERS, not someone with
  #    workspace access. See README "The operator password".
  - name: OPERATOR_PASSWORD
    value: "none"

  # ── the game ──────────────────────────────────────────────────────────────────────────────────────
  # The app finds its Genie space by TITLE, so no space id is ever plumbed in here. The title must match
  # the space you created (see README step 2). `none` means "no suffix".
  - name: GENIE_SPACE_TITLE
    value: "The Data Desk"
  - name: GENIE_SPACE_SUFFIX
    value: "none"
  - name: SEASON_ID
    value: "s1_letters"
  - name: SEASONS
    value: "s1_letters"
  - name: SEASON_TZ
    value: "Australia/Sydney"
  - name: THEME
    value: "databricks"
  - name: ALT_THEME
    value: "neutral"
  - name: ALLOW_DATE_OVERRIDE
    value: "1"
  - name: BUILD_ID
    value: "manual-local"
